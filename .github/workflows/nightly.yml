# Every night: download the county's newest data, check it, save it, and republish the site.
name: Nightly data update

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 5 a.m. Eastern in winter, 6 a.m. in summer
  workflow_dispatch:
    inputs:
      step:
        description: "What to run"
        type: choice
        options: [all, inspect311]
        default: all

concurrency:
  group: nightly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and check county data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python moco_data_pipeline.py ${{ inputs.step || 'all' }} --out-dir .
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mymoco_data.json meta.json permits_clean.csv requests_311_clean.csv
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "Nightly data update $(date -u +%Y-%m-%d)"
            git push
          fi

  publish:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
